<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Dartarossa V7</title><style>:root{--g:#16a34a;--bg:#f3f4f6;--ink:#111827}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--ink)}header{background:#111827;color:#fff;padding:calc(15px + env(safe-area-inset-top)) 14px 14px;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0}.sub,.hint{font-size:12px;color:#6b7280}header .sub{color:#9ca3af}.wrap{max-width:820px;margin:auto;padding:12px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button,.league{white-space:nowrap;text-decoration:none;color:#111827;border:1px solid #d1d5db;border-radius:10px;padding:11px;background:#fff;min-height:44px;font:inherit}.section{display:none}.section.active{display:block}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px #0001;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.big{font-size:23px;font-weight:800}button,input,select{font:inherit;border:1px solid #d1d5db;border-radius:10px;padding:10px;background:#fff;min-height:44px}.primary{background:var(--g);color:#fff;border-color:var(--g)}.danger{background:#dc2626;color:#fff}.wide{width:100%}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-weight:700;font-size:13px;margin:7px 0 4px}svg{width:100%;height:240px;background:#fff;border-radius:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e5e7eb}th{background:#111827;color:#fff;text-align:left}@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}.formgrid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><h1>🎯 DSV Reutlingen · Dartarossa V7</h1><div class="sub">iOS / Android PWA</div></header><main class="wrap"><nav class="tabs"><button data-tab="dash">Übersicht</button><button data-tab="players">Spieler</button><a class="league" href="https://portal.3k-darts.com/frontend/events/11/event/6637/table" target="_blank" rel="noopener noreferrer">Ligatabelle</a><button class="adminOnly" data-tab="entry" hidden>Eingabe</button><button class="adminOnly" data-tab="data" hidden>Daten</button><button data-tab="admin">Admin</button></nav><section id="dash" class="section active"><div id="summary" class="grid"></div><h3>Mannschafts-Fieberkurve</h3><svg id="teamChart" viewBox="0 0 600 240"></svg></section><section id="players" class="section"><div class="card"><label>Spieler</label><select id="viewPlayer" class="wide"></select></div><div id="pstats" class="grid"></div><h3>Einzel-Fieberkurve</h3><svg id="pChart" viewBox="0 0 600 240"></svg><div class="card"><b>Doppel</b><div id="doppel"></div></div><div id="ptable" class="scroll"></div></section><section id="entry" class="section"><div class="card"><b>Ergebnis eingeben</b><form id="form"><div class="formgrid"><div><label>Spieltag</label><select id="day"></select></div><div><label>Spieler</label><select id="player"></select></div><div><label>Art</label><select id="type"><option>Einzel</option><option>Doppel</option></select></div><div><label>AVG</label><input id="avg" inputmode="decimal"></div><div><label>180er</label><input id="h180" type="number" min="0" value="0"></div><div><label>Finish</label><input id="finish" type="number" min="0" value="0"></div><div><label>Shortgame</label><input id="sg" type="number" min="0" value="0"></div></div><button class="primary wide" type="submit" style="margin-top:10px">Speichern</button></form><p id="msg" class="hint"></p></div></section><section id="data" class="section"><div class="card"><b>Datensicherung</b><p class="hint">Lokale Daten als JSON sichern oder wiederherstellen.</p><button id="export">Backup exportieren</button> <label style="display:inline"><input id="import" type="file" accept="application/json"></label></div></section><section id="admin" class="section"><div class="card"><b>Admin</b><form id="login"><label>PIN</label><input id="pin" type="password" inputmode="numeric" class="wide"><button class="primary wide" style="margin-top:8px">Anmelden</button></form><button id="logout" class="wide" hidden>Abmelden</button><p id="loginmsg" class="hint"></p></div></section></main><script>
const N=['Damir','Dennis','Dragan','Kevin','Kolja','Lukas','Mattis','Miralem','Nico','Patrick.A','Patrick.G','Wolfi'];const hist={Damir:{s:{3:75.85,4:60.7},d:64.55},Dennis:{s:{2:63.1,4:66.35},d:65.98},Dragan:{s:{1:48.75},d:66.9},Kevin:{s:{1:52.08},d:51},Kolja:{s:{1:65.3,2:80.55,3:70.35,4:78.39},d:66.74},Lukas:{s:{},d:0},Mattis:{s:{},d:0},Miralem:{s:{1:60.35,2:59,3:61.1},d:57.89},Nico:{s:{2:57.7,4:72.2},d:63.35},'Patrick.A':{s:{},d:0},'Patrick.G':{s:{},d:0},Wolfi:{s:{2:71.8,3:66.1,4:55.1},d:66.43}};const KEY='dartarossa-v7-data';let state=JSON.parse(localStorage.getItem(KEY)||'{"entries":[]}'),admin=sessionStorage.getItem('dv7admin')==='1';const $=q=>document.querySelector(q),mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,card=(t,v)=>`<div class=card><div class=hint>${t}</div><div class=big>${v}</div></div>`;for(let i=1;i<=18;i++)$('#day').add(new Option('Spieltag '+i,i));N.forEach(n=>{$('#player').add(new Option(n,n));$('#viewPlayer').add(new Option(n,n))});$('#viewPlayer').value='Kolja';function vals(name,type){let a=[];if(type==='Einzel')Object.values(hist[name].s).forEach(v=>a.push(v));if(type==='Doppel'&&hist[name].d)a.push(hist[name].d);state.entries.filter(e=>e.player===name&&e.type===type).forEach(e=>a.push(e.avg));return a}function perday(name){let a=Array(18).fill(0);for(let d=1;d<=18;d++){let v=[];if(name&&hist[name].s[d])v.push(hist[name].s[d]);if(!name)N.forEach(n=>hist[n].s[d]&&v.push(hist[n].s[d]));state.entries.filter(e=>e.day===d&&e.type==='Einzel'&&(!name||e.player===name)).forEach(e=>v.push(e.avg));a[d-1]=mean(v)}return a}function chart(el,v){el.innerHTML='';let nz=v.filter(Boolean);if(!nz.length){el.innerHTML='<text x="300" y="120" text-anchor="middle">Keine Werte</text>';return}let lo=Math.min(40,...nz)-2,hi=Math.max(80,...nz)+2,p=[];v.forEach((z,i)=>{if(z){let x=50+i*510/17,y=210-(z-lo)/(hi-lo)*180;p.push(`${x},${y}`);el.innerHTML+=`<circle cx=${x} cy=${y} r=4 fill=#16a34a/>`}});if(p.length>1)el.innerHTML+=`<polyline points="${p.join(' ')}" fill=none stroke=#16a34a stroke-width=4/>`}function render(){document.querySelectorAll('.adminOnly').forEach(x=>x.hidden=!admin);$('#login').hidden=admin;$('#logout').hidden=!admin;let all=N.flatMap(n=>vals(n,'Einzel'));$('#summary').innerHTML=card('Einzelwerte',all.length)+card('Einzel Ø',mean(all).toFixed(2))+card('Spieltage','4 / 18')+card('Modus',admin?'Admin':'Ansicht');chart($('#teamChart'),perday());renderPlayer()}function renderPlayer(){let n=$('#viewPlayer').value,s=vals(n,'Einzel'),d=vals(n,'Doppel');$('#pstats').innerHTML=card('Einzel Ø',mean(s).toFixed(2))+card('Doppel Ø',mean(d).toFixed(2))+card('Gesamt Ø',mean([mean(s),mean(d)].filter(Boolean)).toFixed(2));$('#doppel').innerHTML=hist[n].d?`<div class=big>${hist[n].d.toFixed(2)}</div><div class=hint>Historischer Doppel-Gesamtschnitt aus Excel</div>`:'<span class=hint>Keine historischen Doppelwerte</span>';chart($('#pChart'),perday(n));$('#ptable').innerHTML='<table><tr><th>ST</th><th>Einzel AVG</th></tr>'+Array.from({length:18},(_,i)=>`<tr><td>${i+1}</td><td>${perday(n)[i]?perday(n)[i].toFixed(2):'–'}</td></tr>`).join('')+'</table>'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(b.classList.contains('adminOnly')&&!admin)return;document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.tab).classList.add('active')});$('#viewPlayer').onchange=renderPlayer;$('#login').onsubmit=e=>{e.preventDefault();if($('#pin').value==='2611'){admin=true;sessionStorage.setItem('dv7admin','1');$('#loginmsg').textContent='Admin-Modus aktiv';render()}else $('#loginmsg').textContent='PIN falsch'};$('#logout').onclick=()=>{admin=false;sessionStorage.removeItem('dv7admin');render()};$('#form').onsubmit=e=>{e.preventDefault();if(!admin)return;let a=Number($('#avg').value.replace(',','.'));if(!(a>0&&a<=180)){ $('#msg').textContent='AVG ungültig';return}state.entries.push({day:+$('#day').value,player:$('#player').value,type:$('#type').value,avg:a,h180:+$('#h180').value||0,finish:+$('#finish').value||0,sg:+$('#sg').value||0});localStorage.setItem(KEY,JSON.stringify(state));$('#avg').value='';$('#msg').textContent='Gespeichert';render()};$('#export').onclick=()=>{let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dartarossa-v7-backup.json';a.click()};$('#import').onchange=async e=>{try{state=JSON.parse(await e.target.files[0].text());localStorage.setItem(KEY,JSON.stringify(state));render()}catch{alert('Backup ungültig')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
