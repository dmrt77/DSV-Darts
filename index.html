<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Dartarossa V18</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:3}.wrap{max-width:900px;margin:auto;padding:12px}.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.section{display:none}.section.active{display:block}button,input,select{font:inherit;border:1px solid #d1d5db;border-radius:10px;padding:10px;min-height:44px;background:#fff}.wide{width:100%}.primary{background:#16a34a;color:#fff}.danger{background:#dc2626;color:#fff}.secondary{background:#2563eb;color:#fff}.hint{font-size:12px;color:#6b7280}.big{font-size:24px;font-weight:800}label{display:block;font-size:13px;font-weight:700;margin:6px 0 3px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}svg{width:100%;height:250px;background:#fff;border-radius:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e5e7eb}th{background:#111827;color:#fff;text-align:left}.hidden{display:none!important}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.formgrid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><b>🎯 DSV Reutlingen · Dartarossa V18</b><div class="hint" style="color:#9ca3af">Backup-Daten übernommen · <span id="cloudState">verbindet…</span></div></header><main class="wrap"><div class="card"><label>Aktive Mannschaft</label><select id="teamSelect" class="wide"></select><div id="teamName" class="hint"></div></div><nav class="tabs"><button data-tab="dash">Übersicht</button><button data-tab="players">Spieler</button><button data-tab="admin">Admin</button><button data-tab="entry" class="adminOnly" hidden>Eingabe</button><button data-tab="manage" class="adminOnly" hidden>Verwaltung</button></nav>
<section id="dash" class="section active"><div id="summary" class="grid"></div><div class="card"><button id="tableBtn" type="button" class="secondary wide hidden">Tabelle öffnen</button><p id="tableHint" class="hint"></p></div><div class="card"><b>Mannschaft Einzel</b><svg id="teamS" viewBox="0 0 600 240"></svg></div><div class="card"><b>Mannschaft Doppel</b><svg id="teamD" viewBox="0 0 600 240"></svg></div></section>
<section id="players" class="section"><div class="card"><label>Spieler</label><select id="vp" class="wide"></select></div><div id="pstats" class="grid"></div><div class="card"><b>Einzel</b><svg id="ps" viewBox="0 0 600 240"></svg></div><div class="card"><b>Doppel</b><svg id="pd" viewBox="0 0 600 240"></svg></div><div class="card"><b>Gesamt</b><svg id="pt" viewBox="0 0 600 240"></svg></div><div id="ptable" class="scroll"></div></section>
<section id="admin" class="section"><div class="card"><form id="login"><label>Admin-E-Mail</label><input id="email" type="email" autocomplete="username" class="wide"><label>Admin-Passwort</label><input id="password" type="password" autocomplete="current-password" class="wide"><button class="primary wide" style="margin-top:8px">Anmelden</button></form><button id="logout" type="button" class="wide" hidden>Abmelden</button><p id="loginMsg" class="hint"></p></div></section>
<section id="entry" class="section"><div class="card"><form id="entryForm"><div class="formgrid"><div><label>Spieltag</label><select id="day"></select></div><div><label>Spieler</label><select id="player"></select></div><div><label>Einzel 1</label><input class="sa clearAfter" inputmode="decimal"></div><div><label>Einzel 2</label><input class="sa clearAfter" inputmode="decimal"></div><div><label>Doppel 1</label><input class="da clearAfter" inputmode="decimal"></div><div><label>Doppel 2</label><input class="da clearAfter" inputmode="decimal"></div><div><label>Anzahl 180er</label><input id="h180" class="clearAfter" type="number" min="0" value="0"></div><div><label>Anzahl Highscores</label><input id="highscores" class="clearAfter" type="number" min="0" value="0"></div><div><label>Anzahl Shortgames</label><input id="shortgame" class="clearAfter" type="number" min="0" value="0"></div><div><label>Anzahl Doppel-Shortgames</label><input id="doubleShortgame" class="clearAfter" type="number" min="0" value="0"></div></div><button class="primary wide" style="margin-top:8px">Spieltag speichern</button><button id="deleteDay" type="button" class="danger wide" style="margin-top:8px">Spieltag dieses Spielers löschen</button></form><p id="entryMsg" class="hint"></p></div></section>
<section id="manage" class="section"><div class="card"><b>Mannschaften verwalten</b><label>Neue Mannschaft</label><input id="newTeam" class="wide" maxlength="40"><button id="addTeam" type="button" class="primary wide" style="margin-top:8px">Mannschaft hinzufügen</button><p class="hint">Maximal drei Mannschaften. Daten bleiben strikt getrennt.</p></div><div class="card"><label>Aktive Mannschaft umbenennen</label><input id="renameTeam" class="wide" maxlength="40"><button id="renameBtn" type="button" class="wide" style="margin-top:8px">Namen speichern</button><button id="deleteTeam" type="button" class="danger wide" style="margin-top:8px">Aktive Mannschaft samt Daten löschen</button></div><div class="card"><b>Tabellen-Button</b><label>Beschriftung</label><input id="tableLabel" class="wide"><label>Link</label><input id="tableUrl" class="wide" type="url"><button id="saveTable" type="button" class="primary wide" style="margin-top:8px">Tabellen-Button speichern</button></div><div class="card"><b>Spieler verwalten</b><label>Spieler hinzufügen</label><input id="newPlayer" class="wide"><button id="addPlayer" type="button" class="primary wide" style="margin-top:8px">Spieler hinzufügen</button><label>Spieler auswählen</label><select id="removePlayer" class="wide"></select><button id="removePlayerBtn" type="button" class="danger wide" style="margin-top:8px">Spieler und Daten löschen</button></div><div class="card"><b>Daten löschen</b><button id="clearTeamData" type="button" class="danger wide">Alle Ergebnisse der aktiven Mannschaft löschen</button></div><div class="card"><b>Backup</b><button id="backupFirestore" type="button" class="primary wide">Backup herunterladen</button><p id="backupMsg" class="hint"></p></div><p id="manageMsg" class="hint"></p></section></main><script type="module" src="./app-v18.js?v=18"></script></body></html>
